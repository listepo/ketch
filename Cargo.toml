[package]
name = "ketch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Catch releases straight from GitHub — a package manager for GitHub-released binaries and apps."
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["package-manager", "github", "releases", "installer", "macos"]
categories = ["command-line-utilities", "development-tools"]

# The root stays the `ketch` package: dist (`members = ["cargo:."]`),
# release-plz and the version readers in scripts/ and tests/ all look here.
# `crates/ketch-core` holds everything the binary does besides parsing the
# command line, so another front end can link it without clap.
[workspace]
members = [".", "crates/ketch-core", "crates/ketch-ffi", "crates/ketch-capi"]
# A bare `cargo test` or `cargo clippy` at the root covers the core too.
default-members = [".", "crates/ketch-core", "crates/ketch-ffi", "crates/ketch-capi"]

# One version for both crates: the core reports it (user agent, `--version`,
# the statistics database), so it can never be allowed to drift from the
# binary's. scripts/release.sh, tests/crate-version.sh and site/sync-docs.py
# read and write this line.
[workspace.package]
version = "0.10.0"
edition = "2021"
# Raised from 1.82 by Diesel 2.3, which is the floor for the statistics
# database. Nothing else in the tree needs it.
rust-version = "1.86"
license = "GPL-3.0-or-later OR LicenseRef-Ketch-Royalty-free-1.0 OR LicenseRef-Ketch-Commercial"
repository = "https://github.com/listepo/ketch"

# There is no unsafe code in ketch and there is no reason for any to appear.
[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` builds with `--cfg fuzzing`; only then does `src/lib.rs` hold
# anything (see `fuzz/README.md`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[bin]]
name = "ketch"
path = "src/main.rs"

[features]
# The interactive renderer is deliberately opt-in: the normal binary keeps
# its dependable line-oriented interface and avoids terminal-only dependencies.
# The renderer lives in the binary beside `ui`, which drives it.
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
ketch-core = { path = "crates/ketch-core" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
# `env` lists each option's environment variable on its man page.
clap_mangen = { version = "0.3", features = ["env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dirs = "7"
# canonicalize without Windows `\\?\` UNC prefixes (path compare / display)
dunce = "1"
# Shared file backup (`<name>.bak-<unix-seconds>`) used by `ketch config reset`.
# Published on crates.io as `file-backup`; local development against
# `packages/crates/file-backup` uses a `paths` override in
# `.cargo/config.toml` (see `just setup` / `AGENTS.md`). Do not add a `path`
# or `[patch]` here — CI and release builds must resolve this from the
# registry on the committed lock.
file-backup = "0.1"
# Terminal rendering: `ui` draws the core's events as lines and bars, and the
# opt-in `tui` renderer draws them full screen. The core prints nothing, so
# none of these are its dependencies.
indicatif = "0.18"
# How many columns a status-line icon takes, so the verb column stays aligned.
# Already in the tree through indicatif, so it costs the binary nothing.
unicode-width = "0.2"
# The terminal width `ketch list remote` fits descriptions to. Already in the
# tree through clap's `wrap_help`, so it costs the binary nothing.
terminal_size = "0.4"
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30", optional = true }

# Legacy Windows conhost prints ANSI escapes as text until a program switches
# on virtual terminal processing. console does that per handle without unsafe
# on our side, and is already in the tree through indicatif.
[target.'cfg(windows)'.dependencies]
console = { version = "0.16", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
insta = "1.48"
predicates = "3"
pretty_assertions = "1.4.1"
proptest = "1.11"
rstest = "0.26"
trycmd = "1.2"
# What tests/ builds fixture archives, lockfiles and registries with.
flate2 = "1"
hex = "0.4"
semver = "1"
sha2 = "0.11"
tar = "0.4"
toml = "1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# What `dist build` compiles the release tarballs with: exactly `release`.
[profile.dist]
inherits = "release"

# The ketch-ffi static library inside the macOS app's XCFramework
# (scripts/xcframework.sh). A panic must unwind so UniFFI can turn it into an
# error at the boundary instead of aborting the app that linked it, and the
# symbols stay for the app's own link to strip.
[profile.ffi]
inherits = "release"
panic = "unwind"
strip = false

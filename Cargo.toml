[package]
name = "ketch"
version = "0.3.2"
edition = "2021"
# Raised from 1.82 by Diesel 2.3, which is the floor for the statistics
# database. Nothing else in the tree needs it.
rust-version = "1.86"
description = "Catch releases straight from GitHub — a package manager for GitHub-released binaries and apps."
license = "MIT"
repository = "https://github.com/listepo/ketch"
readme = "README.md"
keywords = ["package-manager", "github", "releases", "installer", "macos"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ketch"
path = "src/main.rs"

[features]
# The interactive renderer is deliberately opt-in: the normal binary keeps
# its dependable line-oriented interface and avoids terminal-only dependencies.
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
bzip2 = "0.4"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
walkdir = "2"
semver = "1"
tempfile = "3"
dirs = "5"
thiserror = "2"
indicatif = "0.17"
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3"
# `bundled` compiles SQLite into the binary. Linking the system one would make
# ketch's single-binary promise depend on what the host happens to ship, and
# the release builds both macOS architectures where that answer differs.
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# `ketch registry push` talks to GitHub through octocrab rather than the ureq
# client the sources use: it needs forks, refs, contents and pull requests,
# which octocrab already types and paginates. It is async, hence tokio for a
# runtime to block on; everything else in ketch stays synchronous.
octocrab = "0.54"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
insta = "1.48.0"
predicates = "3"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
trycmd = "0.15"

# There is no unsafe code in ketch and there is no reason for any to appear.
[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

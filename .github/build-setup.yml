# Injected into cargo-dist's build-local-artifacts job (see dist-workspace.toml
# github-build-setup). Kept one level above .github/workflows so GitHub does not
# treat it as a standalone workflow.
#
# dist signs with CODESIGN_IDENTITY + CODESIGN_CERTIFICATE(+_PASSWORD). This
# repository stores the certificate as MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD;
# `just dist-generate` maps those names into release.yml. The identity is not a
# secret: the certificate is imported into a throwaway keychain and the one
# Developer ID Application identity in it is read back out.

# The Rust that mise.toml pins, the same one local work and ci.yml use, not
# whatever stable the runner image ships, so a release is reproducible from its
# tag. Only rust is installed from mise.toml; the release build needs nothing
# else from it. Runs first so rust-cache keys on this rustc. MSRV (rust-version
# in Cargo.toml) is 1.86.
- name: Install Rust from mise.toml
  uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
  with:
    install_args: rust
    cache_key_prefix: mise-v1-release

# Make the mise pin the active toolchain for every later rustup/cargo call
# (dist), add the cross targets this matrix entry builds to it, and refuse to
# build with any other rustc.
- name: Add the Rust targets this build needs
  shell: bash
  env:
    TARGETS: ${{ join(matrix.targets, ' ') }}
  run: |
    set -euo pipefail
    version="$(mise current rust)"
    echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
    export RUSTUP_TOOLCHAIN="$version"
    # shellcheck disable=SC2086
    rustup target add $TARGETS
    rustc --version
    rustc --version | grep -q "^rustc $version " \
      || { echo "rustc is not the mise.toml pin $version" >&2; exit 1; }

# Release builds are rare; always save so the next cut is warm.
- name: Cache Cargo build
  uses: Swatinem/rust-cache@v2
  with:
    shared-key: release-dist
    cache-on-failure: true

# An unsigned release is refused the same way an untested one is: it would be
# discovered by whoever installs it, not here.
- name: Discover macOS codesign identity
  if: runner.os == 'macOS'
  env:
    MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
  run: |
    set -euo pipefail
    if [ -z "${MACOS_CERTIFICATE:-}" ] || [ -z "${MACOS_CERTIFICATE_PWD:-}" ]; then
      echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set:" >&2
      echo "a base64-encoded Developer ID Application .p12 and its password." >&2
      echo "Signing is on (macos-sign = true); an unsigned macOS release is refused." >&2
      exit 1
    fi

    keychain="$RUNNER_TEMP/ketch-codesign-discover.keychain-db"
    keychain_pwd="$(openssl rand -hex 16)"
    cert="$RUNNER_TEMP/ketch-certificate.p12"
    echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

    security create-keychain -p "$keychain_pwd" "$keychain"
    security set-keychain-settings -lut 21600 "$keychain"
    security unlock-keychain -p "$keychain_pwd" "$keychain"
    security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
      -f pkcs12 -k "$keychain" -T /usr/bin/codesign
    rm -f "$cert"
    security set-key-partition-list -S apple-tool:,apple:,codesign: \
      -s -k "$keychain_pwd" "$keychain" >/dev/null

    identity="$(security find-identity -v -p codesigning "$keychain" \
      | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
    if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
      echo "expected exactly one Developer ID Application identity, found:" >&2
      security find-identity -v -p codesigning "$keychain" >&2
      security delete-keychain "$keychain" || true
      exit 1
    fi

    echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
    security delete-keychain "$keychain"
    echo "CODESIGN_IDENTITY discovered (Developer ID Application hash exported for dist)"

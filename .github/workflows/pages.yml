name: site

# The website is built on every pull request that touches it, so a broken
# template fails review rather than the deploy. Only main publishes.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/docs/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/docs/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two builds, one site: `apps/web` is the Astro landing page and owns `/`,
  # `apps/docs` is the Docusaurus documentation and owns `/docs/`. Each one is
  # configured for the path it will be served from — Astro's `base` is
  # `/ketch`, Docusaurus's `baseUrl` is `/ketch/docs/` — so merging them is a
  # copy, not a rewrite. Nothing here is macOS-specific, so it runs on Linux.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the landing page
        working-directory: apps/web
        run: pnpm run build

      # docs/*.md in the repository is the documentation; sync-docs.mjs copies
      # it into the Docusaurus tree so the two can never drift.
      - name: Build the documentation
        working-directory: apps/docs
        run: |
          node sync-docs.mjs
          pnpm run build

      - name: Merge the two builds
        run: |
          rm -rf public
          cp -R apps/web/dist public
          # The docs build is mounted whole under /docs/; Astro is configured
          # not to own that path, so nothing is overwritten here.
          cp -R apps/docs/build public/docs

      - name: Check the build produced what it should
        run: |
          cd public
          for required in index.html favicon.svg \
                          docs/index.html docs/sitemap.xml \
                          docs/manifests/index.html docs/registry/index.html \
                          docs/lockfile/index.html docs/plugins/index.html \
                          docs/roadmap/index.html; do
            [ -s "$required" ] || { echo "missing or empty: $required" >&2; exit 1; }
          done
          # The SEO tags are the point of the landing page; a template that
          # silently renders nothing would still produce a valid-looking site.
          grep -q '<meta name="description"' index.html
          grep -q '<link rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'SoftwareApplication' index.html
          # A meta description an engine truncates is one a search result shows
          # truncated. Catch it here rather than on the deployed page.
          if grep -qE '<meta name="description" content="[^"]{161,}"' index.html; then
            echo "the meta description is over 160 characters" >&2
            exit 1
          fi
          echo "site ok: $(find . -name '*.html' | wc -l) pages"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

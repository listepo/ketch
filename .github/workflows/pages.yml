name: site

# The website is built on every pull request that touches it, so a broken
# template fails review rather than the deploy. Only main publishes.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "*.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "*.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so the site builds the same way next year as it does today.
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloaded from the project's own release and checked against the
      # checksum published beside it — the same thing ketch does for everything
      # it installs.
      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          sudo install -m 755 hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # docs/*.md is the documentation; the site's copies are generated from it
      # so the two can never drift.
      - name: Mirror the Markdown into the site
        run: python3 site/sync-docs.py

      - name: Build
        env:
          # A pull-request build has no Pages URL yet, and only needs to prove
          # the templates compile.
          BASE_URL: ${{ steps.pages.outputs.base_url || 'https://listepo.github.io/ketch' }}
        run: |
          hugo --source site --minify --gc --baseURL "$BASE_URL/"

      - name: Check the build produced what it should
        run: |
          cd site/public
          for required in index.html sitemap.xml robots.txt docs/index.html \
                          docs/manifests/index.html docs/registry/index.html \
                          docs/plugins/index.html docs/roadmap/index.html \
                          css/main.css img/og.png; do
            [ -s "$required" ] || { echo "missing or empty: $required" >&2; exit 1; }
          done
          # The SEO tags are the point of the landing page; a template that
          # silently renders nothing would still produce a valid-looking site.
          grep -q '<meta name="description"' index.html
          grep -q 'og:image' index.html
          grep -q 'application/ld+json' index.html
          grep -q '<link rel="canonical"' index.html
          echo "site ok: $(find . -name '*.html' | wc -l) pages"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

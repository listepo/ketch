# Build the ketch site (Hugo + Mini UI CSS + Pagefind) and deploy it to GitHub Pages through
# pyrlyn/infra's pages.yml. The build and its checks live in scripts/site-build.sh; Hugo is
# installed (checksum-verified) by scripts/site-install-hugo.sh; Node comes from mise.toml.
# Pull requests build and check only; pushes to main deploy.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/site-*.sh"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/site-*.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: pyrlyn/infra/.github/workflows/pages.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise-install-args: node
      # Pinned so the site builds the same way next year as it does today.
      setup-command: HUGO_VERSION=0.165.0 bash scripts/site-install-hugo.sh
      build-command: BASE_URL=https://pyrlyn.github.io/ketch bash scripts/site-build.sh
      artifact-path: site/public

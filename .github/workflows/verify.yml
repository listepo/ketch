name: verify

# The gate ci.yml applies to every pull request, applied once more to the
# commit a release is cut from. A release is the one build nobody can re-run
# for themselves: a broken binary on the releases page is installed before
# anyone notices, and `ketch self upgrade` hands it to everyone already running
# an older copy.
#
# It runs in the two workflows that dispatch release.yml (bump.yml,
# release-plz.yml), not inside release.yml itself. dist's `host` job proceeds
# when `build-local-artifacts` is skipped — which is what a failed dist custom
# job produces — so a gate in there would publish an empty release rather than
# stop one. Here a red gate means no dispatch, no tag, and nothing on the
# releases page.
#
# Same runners and same steps as ci.yml's check jobs, deliberately: a gate that
# tests something narrower than the one every pull request passed lets through
# what that one caught.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo nextest run --all-targets --locked

      - name: Test (tui)
        run: cargo nextest run --all-targets --locked --features tui

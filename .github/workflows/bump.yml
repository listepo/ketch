name: Bump and release

# The one-click way to cut a release: raise the version, land one commit on
# main with its CHANGELOG.md entry, and start the dist release workflow for it.
# Nobody types a version number — scripts/release.sh decides it, the same
# script `just release` and release-plz.yml run.
#
# Why a second workflow rather than a step inside release.yml: release.yml is
# generated by `dist generate` and must never be hand-edited. A
# workflow_dispatch started with GITHUB_TOKEN is the documented exception to
# GitHub's "events from GITHUB_TOKEN do not start workflows" rule, so no
# personal access token is needed here. The version commit itself, pushed
# with that token, starts nothing — not ci.yml, which verify has just stood in
# for, and not release-plz.yml.
on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]
      # No `dry_run` input: a green "Bump and release" reads as a release. The
      # preview is local only — `scripts/release.sh <level> --dry-run`.

permissions:
  contents: write # push the version commit
  actions: write # dispatch release.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same gate every pull request passes, on the commit this release is cut
  # from. The version commit release.sh makes afterwards touches only
  # Cargo.toml, Cargo.lock and CHANGELOG.md, so what is tested is what ships.
  verify:
    uses: ./.github/workflows/verify.yml

  bump:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags decide whether the current version was already released; the
          # changelog reads the history since the last one.
          fetch-depth: 0
          persist-credentials: true

      # git-cliff at the version mise.toml pins, and nothing else from it: the
      # Rust toolchain is the runner's stable, as everywhere else in CI.
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ inputs.level }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh "$LEVEL"

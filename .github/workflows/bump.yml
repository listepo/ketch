name: Bump and release

# The first way in: raise the version, land one commit, and start the dist
# release workflow for it, through pyrlyn/infra's bump.yml. It first runs the
# gate every pull request passes (verify-command, on macOS, Linux and Windows)
# on the commit the release is cut from, then `scripts/release.sh <level>`,
# which commits `chore: release vX.Y.Z` and dispatches release.yml. The version
# commit touches only Cargo.toml, Cargo.lock and CHANGELOG.md, so what is
# tested is what ships. No `dry_run` input: a green "Bump and release" reads as
# a release. The preview is local only: `scripts/release.sh <level> --dry-run`.
# A failed run opens a `release-failure` issue (infra notify-failure job, issues: write).
# Pinned to pyrlyn/infra ci/notify-release-failure (on top of #11); repin to its merge commit.
on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/infra/.github/workflows/bump.yml@d709124d53dd4923eff8f594b3155842508b0049
    permissions:
      contents: write # push the version commit
      actions: write # dispatch release.yml, cancel-run
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      release-script: scripts/release.sh
      # git-cliff and the Rust (scripts/release.sh runs cargo) at the mise.toml pins.
      mise-install-args: rust git-cliff
      verify-os: '["macos-latest", "ubuntu-latest", "windows-latest"]'
      verify-mise-install-args: rust
      verify-tools: nextest
      verify-command: |
        if [ "$RUNNER_OS" = macOS ]; then cargo fmt --all -- --check; fi
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        cargo nextest run --workspace --all-targets --locked
        cargo nextest run --workspace --all-targets --locked --features tui

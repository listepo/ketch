name: release

# Tagging is the trigger, so cutting a release is `git tag v0.2.0 && git push
# --tags` and nothing else. The manual trigger exists to re-run a publish that
# failed after the tag was already pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      # `ketch self update` compares the running binary's version against the
      # release tag. A tag that disagrees with Cargo.toml makes every installed
      # copy either miss the update or reinstall forever.
      - name: Tag matches Cargo.toml
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          crate="v$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"ketch","version":"\([^"]*\)".*/\1/p')"
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "$tag matches Cargo.toml"

  build:
    needs: verify
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The certificate goes into a keychain of its own, created for this job
      # and deleted at the end of it, so nothing is left on the runner and the
      # login keychain is never touched. An unsigned release is refused the
      # same way an untagged one is: it would be discovered by whoever installs
      # it, not here.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
            echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set:" >&2
            echo "a base64-encoded Developer ID Application .p12 and its password." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pwd="$(openssl rand -hex 16)"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$cert"
          # Without this, codesign would prompt for the key and hang the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pwd" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
          if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one Developer ID Application identity, found:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "KETCH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh ${{ matrix.target }} dist

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      # The arm64 runner can build the x86_64 slice but cannot run it, so only
      # the native one is smoke-tested here.
      - name: Smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          tar -xzf dist/ketch-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketch" --version
          # What was signed must still be signed after the round trip through
          # tar, and by a Developer ID, not ad hoc.
          codesign --verify --strict "$RUNNER_TEMP/ketch"
          codesign --display --verbose=2 "$RUNNER_TEMP/ketch" 2>&1 \
            | grep -q 'Authority=Developer ID Application'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find staging -name '*.tar.gz' -exec mv {} dist/ \;
          cd dist
          # One aggregate file, named so `ketch self update` recognises it and
          # install.sh can grep it. Sorted, so the file is reproducible.
          shasum -a 256 $(ls *.tar.gz | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi

  # The Homebrew cask in listepo/homebrew-tap is generated from this release:
  # version and both checksums. It runs after publish so `brew install` never
  # names a tarball that is not on the releases page yet.
  tap:
    needs: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Update the cask
        env:
          # A token that can push to listepo/homebrew-tap. The default
          # GITHUB_TOKEN is scoped to this repository, so it cannot.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: listepo/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask in $TAP_REPO was not updated" >&2
            exit 1
          fi
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          arm="$(shasum -a 256 staging/aarch64-apple-darwin/ketch-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
          intel="$(shasum -a 256 staging/x86_64-apple-darwin/ketch-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          scripts/cask.sh "$version" "$arm" "$intel" > tap/Casks/ketch.rb
          brew style tap/Casks/ketch.rb

          cd tap
          # The tap starts life empty; the first release makes its main branch.
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -q -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ketch.rb
          if git diff --cached --quiet; then
            echo "cask already at $version"
            exit 0
          fi
          git commit -m "ketch $version"
          git push origin HEAD

name: release

# Publishing creates the tag, not the other way round.
#
# Two ways to start a release:
#
# - Merging to main (including merging a `release/*` branch or a manual bump
#   pull request): if the version in `Cargo.toml` has no tag yet, the whole
#   gate runs, both macOS architectures are built and signed, the tarballs go
#   up on a *draft* release, and publishing that draft is what creates
#   `v<version>` — at the commit that was built. So a tag exists if and only
#   if a release completed. A build that fails leaves main untagged and
#   nothing half-published for `install.sh` or `ketch self upgrade` to find.
#
# - Manually, with a bump: `gh workflow run release.yml -f bump=patch|minor|
#   major` opens a version-bump pull request from `release/v<version>`.
#   Merging it is the release, through the path above. Nothing is typed to
#   cut a patch by hand beyond choosing the bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to propose (opens a release pull request)"
        type: choice
        options: [patch, minor, major]
        required: false
      force:
        description: "Publish even when the tag exists, to re-run a failed upload or cask push"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time. Two merges landing together would race for the same
# tag, and cancelling a run halfway could leave a draft release behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A manual bump run stops here: it proposes a version, it does not publish.
  # Everything below only runs on pushes to main (or a force re-run).
  propose:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the bumped version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"ketch","version":"\([^"]*\)".*/\1/p')"
          [ -n "$current" ] || { echo "could not read the version out of Cargo.toml" >&2; exit 1; }
          # Only the numeric core is bumped; a prerelease suffix never survives one.
          core="${current%%-*}"
          major="${core%%.*}"; rest="${core#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          case "$BUMP" in
            patch) patch="$((patch + 1))" ;;
            minor) minor="$((minor + 1))"; patch=0 ;;
            major) major="$((major + 1))"; minor=0; patch=0 ;;
            *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          {
            echo "current=$current"
            echo "version=$version"
            echo "tag=v$version"
            echo "branch=release/v$version"
          } >> "$GITHUB_OUTPUT"
          echo "$current -> $version"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "branch $BRANCH already exists; doing nothing" >&2
            exit 0
          fi
          git checkout -b "$BRANCH"
          # Rewrite only the version inside [package]: `rust-version` and every
          # dependency's inline `version =` must be left alone.
          awk -v new="$VERSION" '
            /^\[package\]/ { in_pkg = 1; print; next }
            /^\[/          { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=/ && !done {
              printf "version = \"%s\"\n", new; done = 1; next
            }
            { print }
          ' Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
          cargo update --workspace --quiet \
            || { echo "could not update Cargo.lock" >&2; exit 1; }
          git add Cargo.toml Cargo.lock
          git commit -m "Release $TAG

          Bumps the version the release workflow publishes and tags."
          git push -u origin "$BRANCH"
          if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
            echo "a pull request for $BRANCH is already open"
          else
            gh pr create --base main --head "$BRANCH" --title "Release $TAG" \
              --body "Bumps \`Cargo.toml\` and \`Cargo.lock\` from \`$CURRENT\` to \`$VERSION\`.

          Merging this pull request is the release: the release workflow re-runs the whole gate, builds both macOS architectures, publishes the tarballs with an aggregate \`SHA256SUMS\`, and creates \`$TAG\` last."
          fi
  # The cheap job that decides whether this merge is a release at all, so an
  # ordinary one stops here in seconds.
  #
  # The version in `Cargo.toml` *is* the tag: `ketch self upgrade` compares the
  # running binary's version against the release tag, so deriving one from the
  # other is what keeps them from disagreeing. It also means "already tagged"
  # is the same statement as "already released".
  version:
    # A manual bump proposes a version rather than publishing one.
    if: github.event_name != 'workflow_dispatch' || inputs.bump == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version released yet?
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"ketch","version":"\([^"]*\)".*/\1/p')"
          if [ -z "$version" ]; then
            echo "could not read the version out of Cargo.toml" >&2
            exit 1
          fi
          tag="v$version"
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            # Repairing a published release must rebuild that tag's commit, not
            # whatever HEAD is now. A force with no tag is a first publish that
            # should have been an ordinary run.
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag does not exist; force only rebuilds a published release" >&2
              exit 1
            fi
            # Annotated tags peel via ^{commit}; lightweight tags only have the plain
            # refs/tags/<tag> line (v0.4.1 was lightweight and broke force repairs).
            ref="$(git ls-remote origin "refs/tags/${tag}^{commit}" | awk '{print $1; exit}')"
            if [ -z "$ref" ]; then
              ref="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1; exit}')"
            fi
            if [ -z "$ref" ]; then
              echo "could not resolve $tag to a commit" >&2
              exit 1
            fi
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag: forced, publishing $ref again"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag has no tag yet; releasing it"
          fi

  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo nextest run --all-targets --locked

  build:
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            sign: true
          - target: x86_64-apple-darwin
            os: macos-latest
            sign: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            sign: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            sign: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            sign: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: Swatinem/rust-cache@v2


      # The certificate goes into a keychain of its own, created for this job
      # and deleted at the end of it, so nothing is left on the runner and the
      # login keychain is never touched. An unsigned release is refused the
      # same way an untested one is: it would be discovered by whoever installs
      # it, not here.
      - name: Import signing certificate
        if: matrix.sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
            echo "MACOS_CERTIFICATE and MACOS_CERTIFICATE_PWD must both be set:" >&2
            echo "a base64-encoded Developer ID Application .p12 and its password." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pwd="$(openssl rand -hex 16)"
          cert="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert"

          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PWD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm -f "$cert"
          # Without this, codesign would prompt for the key and hang the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pwd" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p')"
          if [ "$(printf '%s\n' "$identity" | grep -c .)" -ne 1 ]; then
            echo "expected exactly one Developer ID Application identity, found:" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "KETCH_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package.sh ${{ matrix.target }} dist

      - name: Remove signing keychain
        if: always() && matrix.sign && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      # Off until an App Store Connect key exists: setting the repository
      # variable KETCH_NOTARIZE to `true` turns it on, and from then on a
      # missing secret fails the release, as a missing certificate does. A bare
      # Mach-O cannot carry a stapled ticket (stapler takes only bundles, disk
      # images and packages), so the tarball stays as built and Gatekeeper
      # looks the ticket up online by the binary's cdhash.
      - name: Notarise
        if: matrix.sign && vars.KETCH_NOTARIZE == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "KETCH_NOTARIZE is on, so APPSTORE_CONNECT_KEY (the .p8 as base64)," >&2
            echo "APPSTORE_CONNECT_KEY_ID and APPSTORE_CONNECT_ISSUER_ID must all be set." >&2
            exit 1
          fi
          work="$RUNNER_TEMP/notarise"
          mkdir -p "$work"
          key="$work/key.p8"
          trap 'rm -f "$key"' EXIT
          echo "$NOTARY_KEY" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")

          # notarytool takes a zip, not a tarball. The ticket is keyed by the
          # binary's cdhash, so notarising this copy covers the one in dist/.
          tar -xzf dist/ketch-${{ matrix.target }}.tar.gz -C "$work" ketch
          ditto -c -k --keepParent "$work/ketch" "$work/ketch.zip"
          xcrun notarytool submit "$work/ketch.zip" "${auth[@]}" \
            --wait --output-format json > "$work/result.json" || true
          cat "$work/result.json"
          if [ "$(jq -r .status "$work/result.json")" != "Accepted" ]; then
            id="$(jq -r .id "$work/result.json")"
            xcrun notarytool log "$id" "${auth[@]}" >&2 || true
            exit 1
          fi

      # The arm64 runner can build the x86_64 slice but cannot run it, so only
      # the native one is smoke-tested here.
      # Extract into a workspace-relative dir. Git Bash on windows-latest mangles
      # `$RUNNER_TEMP` (e.g. `D:\a\_temp` → `D\:\a\\_temp`) so GNU tar cannot
      # open it; a relative path works the same on every runner OS.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          mkdir -p smoke
          tar -xzf dist/ketch-${{ matrix.target }}.tar.gz -C smoke
          bin="smoke/ketch"
          if [ -f smoke/ketch.exe ]; then
            bin="smoke/ketch.exe"
          fi
          "$bin" --version
          if [ "${{ matrix.sign }}" = "true" ]; then
            codesign --verify --strict smoke/ketch
            codesign --display --verbose=2 smoke/ketch 2>&1 \
              | grep -q 'Authority=Developer ID Application'
          fi
          if [ "${{ matrix.sign }}" = "true" ] && [ "${{ vars.KETCH_NOTARIZE }}" = "true" ]; then
            spctl --assess --type install -vv smoke/ketch 2>&1 \
              | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find staging -name '*.tar.gz' -exec mv {} dist/ \;
          cd dist
          # One aggregate file, named so `ketch self upgrade` recognises it and
          # install.sh can grep it. Sorted, so the file is reproducible.
          shasum -a 256 $(ls *.tar.gz | sort) > SHA256SUMS
          cat SHA256SUMS

      # The release is assembled as a draft, which has no tag, and only the
      # last step here publishes it. That is the step that creates the tag, at
      # the commit this run built — so an interrupted release leaves a draft to
      # be re-run or deleted, never a tag with nothing behind it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # release-plz already wrote what changed, in the section for this
          # version. Its own generated notes are the fallback.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md

          notes=(--generate-notes)
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          fi

          # A draft from an earlier attempt is found by tag name as well.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # The trigger SHA is this run's workflow file, not necessarily the
            # commit being rebuilt. A forced re-run after main has moved must
            # still tag the commit that was checked out and built.
            target="$(git rev-parse HEAD)"
            gh release create "$TAG" dist/* \
              --draft \
              --target "$target" \
              --title "$TAG" \
              "${notes[@]}"
          fi

          # Everything is uploaded and verified: this is the release, and the
          # tag it creates is the record of it.
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published \(.tagName) draft=\(.isDraft) assets=\(.assets | length)"'

  # The Homebrew cask in listepo/homebrew-tap is generated from this release:
  # version and both checksums. It runs after publish so `brew install` never
  # names a tarball that is not on the releases page yet.
  tap:
    needs: [version, publish]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # From the published release, not this run's build artifacts: a tap
      # failure can then be re-run without rebuilding (and re-uploading)
      # binaries the tag already describes.
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern 'ketch-*-apple-darwin.tar.gz' --dir dist
          ls -l dist

      - name: Generate the cask
        env:
          # A token that can push to listepo/homebrew-tap. The default
          # GITHUB_TOKEN is scoped to this repository, so it cannot.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: listepo/homebrew-tap
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask in $TAP_REPO was not updated" >&2
            exit 1
          fi
          # Checksums come from the published tag; the version advertised in
          # the cask must be that tag's, not HEAD's Cargo.toml if they differ.
          release_tag="$(gh release view "$TAG" --json tagName --jq .tagName)"
          release_version="${release_tag#v}"
          if [ "$release_version" != "$VERSION" ]; then
            echo "cask version $release_version from $TAG does not match workflow version $VERSION" >&2
            exit 1
          fi
          arm="$(shasum -a 256 dist/ketch-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
          intel="$(shasum -a 256 dist/ketch-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          scripts/cask.sh "$release_version" "$arm" "$intel" > tap/Casks/ketch.rb

      - name: Lint the cask
        run: brew style tap/Casks/ketch.rb

      # Commit before smoking: `brew tap … $PWD/tap` uses the git HEAD of a
      # path tap, so an uncommitted Casks/ketch.rb would still install the
      # previous release and leave the new checksums untested.
      - name: Commit the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -q -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ketch.rb
          if git diff --cached --quiet; then
            echo "cask already at $VERSION"
          else
            git commit -m "ketch $VERSION"
          fi

      # brew style only checks syntax; install and uninstall postflights run
      # for real only under `brew install --cask`. Smoke the file about to be
      # pushed so a broken bootstrap (e.g. recursive brew uninstall) never
      # reaches the tap.
      - name: Smoke test the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          # postflight runs `ketch self install`, which hits the GitHub API for
          # the just-published tag. Without a token, shared runner IPs are
          # rate-limited (HTTP 403) and the smoke fails after the release is
          # already public — leaving the tap a version behind.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          KETCH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Homebrew 4.6+ rejects bare cask paths; install via a local tap of the
          # clone we are about to push (listepo/homebrew-tap → listepo/tap).
          # Drop a prior tap first: otherwise `brew tap name path` can leave the
          # remote clone in place and smoke the published 0.x.y cask instead of
          # the one Generate just wrote for this tag.
          brew untap listepo/tap >/dev/null 2>&1 || true
          brew tap listepo/tap "$PWD/tap"
          # Guard: the cask under this tap must advertise the version we published.
          cask_version="$(brew info --cask --json=v2 listepo/tap/ketch | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          if [ "$cask_version" != "${{ needs.version.outputs.version }}" ]; then
            echo "smoke would install cask $cask_version, expected ${{ needs.version.outputs.version }}" >&2
            echo "---- tap/Casks/ketch.rb ----" >&2
            cat tap/Casks/ketch.rb >&2
            exit 1
          fi
          brew install --cask --verbose listepo/tap/ketch
          brew uninstall --cask ketch

      - name: Push the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd tap
          # Commit happened before smoke; push whatever HEAD is (may already
          # match the remote if this tag was re-run).
          if git rev-parse --verify @{u} >/dev/null 2>&1; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
              echo "cask already at $VERSION on the remote"
              exit 0
            fi
          fi
          git push origin HEAD

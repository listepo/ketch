name: release

# Tagging is the trigger, so cutting a release is `git tag v0.2.0 && git push
# --tags` and nothing else. The manual trigger exists to re-run a publish that
# failed after the tag was already pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true

jobs:
  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      # `ketch self update` compares the running binary's version against the
      # release tag. A tag that disagrees with apps/cli/package.json makes every
      # installed copy either miss the update or reinstall forever. The version
      # the binary prints is `VERSION` in apps/cli/src/cli.ts, which the test
      # run above pins to this same field — so checking the manifest checks
      # both.
      - name: Tag matches apps/cli/package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -e 'const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("apps/cli/package.json", "utf8"));
            process.stdout.write(m.version);')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match apps/cli/package.json version $pkg" >&2
            exit 1
          fi
          echo "$tag matches apps/cli/package.json"

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Bun cross-compiles, so one runner could produce both slices.
          # Each is built on its own architecture anyway, because that is what
          # lets the smoke step below actually run what it just built. If
          # GitHub retires this label, replace it with whatever the current
          # Intel macOS image is; dropping the leg would ship a release that
          # silently abandons every Intel Mac.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package
        run: scripts/package.sh ${{ matrix.target }} dist

      # Each slice is built on its own architecture, so each one can be run
      # where it was built — and running it means the whole end-to-end suite,
      # not `--version`. This is the last point at which a binary that compiles
      # but cannot install anything is still catchable.
      - name: The end-to-end suite against the packaged binary
        run: |
          tar -xzf dist/ketch-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ketch" --version
          KETCH_E2E_BINARY="$RUNNER_TEMP/ketch" pnpm exec vitest run --root apps/cli tests

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          find staging -name '*.tar.gz' -exec mv {} dist/ \;
          cd dist
          # One aggregate file, named so `ketch self update` recognises it and
          # install.sh can grep it. Sorted, so the file is reproducible.
          shasum -a 256 $(ls *.tar.gz | sort) > SHA256SUMS
          cat SHA256SUMS

          # Both architectures or nothing: a release missing one leaves those
          # machines unable to install and unable to update.
          for required in ketch-aarch64-apple-darwin.tar.gz \
                          ketch-x86_64-apple-darwin.tar.gz; do
            [ -s "$required" ] || { echo "missing asset: $required" >&2; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi

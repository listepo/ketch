name: release-plz

# The second way in: release-plz keeps one "chore: release vX.Y.Z" pull request
# open on main with the next version and its CHANGELOG.md entry, both derived
# from the conventional commits since the last tag, through pyrlyn/infra's
# release-plz.yml. Merging it runs the verify gate on the merge commit, then
# dispatches the dist release workflow (release.yml, tag=vX.Y.Z), as
# `scripts/release.sh patch --no-bump` did.
#
# A merge is a commit line that *is* the pull request title (release-plz.toml
# `pr_name`, optionally with GitHub's " (#123)") from a `release-plz-` branch:
# `scripts/release.sh` pushes a version commit with the same subject straight
# to main and dispatches the release itself. While the current version has no
# tag (a release still being published) the pull request is left alone.
#
# release-plz creates neither the tag nor the GitHub release; dist does both.
# RELEASE_PLZ_TOKEN (fine-grained PAT: contents and pull requests, write; now
# an organization secret) is required: GitHub starts no workflow from a
# GITHUB_TOKEN event, so a pull request opened with it would carry no CI.
# A failed run opens a `release-failure` issue (infra notify-failure job,
# issues: write). Pinned to pyrlyn/infra ci/notify-release-failure (on top of
# #11); repin to its merge commit.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: pyrlyn/infra/.github/workflows/release-plz.yml@0139bdcb95d4e021540743f8fe2c83529a8f676e
    permissions:
      contents: write # the release branch
      pull-requests: write # the release pull request
      actions: write # dispatch release.yml, cancel-run
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      package: ketch
      release-commit-pattern: >-
        ^chore: release v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*)( \(#[0-9]+\))?$
      release-branch-prefix: release-plz-
      release-workflow: release.yml
      verify-os: '["macos-latest", "ubuntu-latest", "windows-latest"]'
      verify-mise-install-args: rust
      verify-tools: nextest
      verify-command: |
        if [ "$RUNNER_OS" = macOS ]; then cargo fmt --all -- --check; fi
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        cargo nextest run --workspace --all-targets --locked
        cargo nextest run --workspace --all-targets --locked --features tui
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

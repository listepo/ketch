name: release-plz

# The second way in: release-plz keeps one "chore: release vX.Y.Z" pull request
# open on main with the next version and its CHANGELOG.md entry, both derived
# from the conventional commits since the last tag. Merging it dispatches the
# dist release workflow through the same scripts/release.sh as bump.yml.
#
# release-plz creates neither the tag nor the GitHub release — dist does both
# from release.yml, once every target has built — and reads the tag dist
# pushes to learn that a version is out (release-plz.toml).
#
# RELEASE_PLZ_TOKEN (a fine-grained PAT or GitHub App token: contents and pull
# requests, write) is required, not optional: GitHub starts no workflow from a
# GITHUB_TOKEN event, so a pull request opened with the default token would be
# merged having never run ci.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  # Is this push the merge of release-plz's pull request? Two things must hold.
  # A line that *is* the pull request title — the squash title, with the
  # " (#123)" GitHub appends, or the title line of a merge commit — never a
  # mention inside a sentence. And the commit belongs to a pull request from a
  # `release-plz-` branch: `just release` pushes a version commit with that
  # same subject straight to main, and dispatches the release itself.
  gate:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.check.outputs.merged }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=false
          if git log -1 --format=%B | grep -qE '^chore: release v[0-9]+\.[0-9]+\.[0-9]+( \(#[0-9]+\))?$'; then
            prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.head.ref | startswith("release-plz-"))] | length')"
            [ "$prs" -gt 0 ] && merged=true
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "release pull request merged: $merged"

  release-pr:
    # The merge of the release pull request itself has nothing new to propose.
    needs: gate
    if: needs.gate.outputs.merged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Without the token, release-plz/action still opens the pull request —
      # with GITHUB_TOKEN, whose events GitHub refuses to start workflows from.
      # The pull request then carries no CI at all, and the only sign is a
      # checks list that is empty rather than red. Fail here instead.
      # https://release-plz.dev/docs/github/token
      - name: A token that gives the release pull request its CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "A pull request opened with the default GITHUB_TOKEN starts no workflows," >&2
            echo "so the release would be merged without ci.yml ever having run on it." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The changelog is built from the whole history, not one commit.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      # A release pull request is written against the last released version,
      # so proposing one while a release is still being built would compare
      # against a tag that does not exist yet and bump from the wrong place.
      # dist creates the tag only when the release is published; until then
      # the pull request is left alone, and the next push after it updates it.
      - name: Is a release still being published?
        id: pending
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"ketch","version":"\([^"]*\)".*/\1/p')"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "v$version is not released yet; leaving the release pull request alone"
          fi

      - name: Open or update the release pull request
        if: steps.pending.outputs.pending == 'false'
        uses: release-plz/action@v0.5.137
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # The same gate every pull request passes, on the merge commit this release
  # is cut from.
  verify:
    needs: gate
    if: needs.gate.outputs.merged == 'true'
    uses: ./.github/workflows/verify.yml

  release:
    needs: [gate, verify]
    if: needs.gate.outputs.merged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch release.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Start the dist release workflow for the merged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-bump: dispatch the version Cargo.toml already carries; never
        # raise it here. Nothing is committed, so git-cliff is not needed.
        run: scripts/release.sh patch --no-bump

name: release-plz

# Every merge to main keeps one pull request up to date: the next version, and
# the changelog entry for it, both derived from the conventional commits since
# the last tag. Merging that pull request pushes the tag, and the tag is what
# release.yml turns into published tarballs.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    runs-on: ubuntu-latest

    # release-plz never builds ketch — it reads metadata, rewrites the version
    # and resolves the lockfile — so the macOS-only gate does not apply here.
    permissions:
      contents: write
      pull-requests: write

    # Two merges landing together must not race for the same release pull
    # request, and cancelling the first one halfway would leave it stale.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # A workflow run authenticated with the default GITHUB_TOKEN cannot start
      # another workflow run, so a tag pushed with it would never reach
      # release.yml: the tag would exist, the tarballs would not, and both
      # install.sh and `ketch self update` read exactly those tarballs. That
      # failure is silent at the moment it happens and only visible to people
      # trying to install. Fail here, loudly, instead.
      #
      # See https://release-plz.dev/docs/github/token — a fine-grained PAT or a
      # GitHub App token with contents and pull-requests read/write.
      - name: A token that can trigger release.yml
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "The default GITHUB_TOKEN cannot trigger release.yml from a" >&2
            echo "pushed tag, so a release would be created with no binaries." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The changelog is built from the whole history, not one commit.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      # Ordered, not parallel: `release` tags whatever release pull request was
      # just merged, and only then does `release-pr` open the next one. Run the
      # other way round and the new pull request is written against a version
      # that has not been tagged yet.
      - name: Tag the merged release
        uses: release-plz/action@v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Open or update the release pull request
        uses: release-plz/action@v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

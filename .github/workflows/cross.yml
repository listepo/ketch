# Linux and Windows jobs, on demand.
#
# `cargo test` already runs the matching platform's tests via `#[cfg(target_os)]`.
# This workflow is the Windows runner (and a Linux packaging smoke), started
# from Actions → cross → Run workflow.

name: cross

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Package the host target
        run: scripts/package.sh x86_64-unknown-linux-gnu dist

      - name: The tarball contains a runnable ketch
        run: |
          cd dist
          sha256sum ketch-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          mkdir -p unpacked && tar -xzf ketch-x86_64-unknown-linux-gnu.tar.gz -C unpacked
          binary=$(find unpacked -name ketch -type f | head -1)
          [ -n "$binary" ] || { echo "no ketch binary in the tarball" >&2; exit 1; }
          "$binary" --version

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: The release binary starts
        run: |
          cargo build --release --locked
          target/release/ketch.exe --version

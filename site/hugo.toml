# The ketch website: landing page plus the docs, from one build.
#
# Docs pages are generated from the Markdown in the repository root by
# `sync-docs.py`, so `docs/*.md` stays the single source and the site never
# drifts from it.

baseURL = "https://listepo.github.io/ketch/"
languageCode = "en-us"
title = "ketch"
enableRobotsTXT = true

# Every page is either the landing page or a doc; there are no taxonomies to
# generate thin, duplicate pages that only dilute the site in search results.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Install command-line tools and macOS apps straight from GitHub releases. No taps, no formulae, no build step — ketch downloads what a project already ships, verifies it, and puts it on your PATH."
  tagline = "Catch releases straight from GitHub."
  author = "Ivan Tugay"
  repo = "https://github.com/listepo/ketch"
  registryRepo = "https://github.com/listepo/ketch-registry"
  ogImage = "img/og.png"
  keywords = ["package manager", "macOS", "GitHub releases", "CLI", "Rust", "homebrew alternative", "install binaries"]

[menu]
  [[menu.main]]
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menu.main]]
    name = "Registry"
    url = "/docs/registry/"
    weight = 20
  [[menu.main]]
    name = "Roadmap"
    url = "/docs/roadmap/"
    weight = 30
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/listepo/ketch"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[sitemap]
  changefreq = "weekly"
  priority = 0.5

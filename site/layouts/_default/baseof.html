<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ partial "seo.html" . }}
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
</head>
<body class="{{ if .IsHome }}home{{ else }}doc{{ end }}">
  {{ partial "header.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>

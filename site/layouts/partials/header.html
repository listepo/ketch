<header class="site-header">
  <a class="brand" href="{{ "" | relURL }}">
    <span class="brand-mark" aria-hidden="true">⚓</span>
    <span class="brand-name">ketch</span>
  </a>
  <nav aria-label="Main">
    {{ range site.Menus.main }}
      {{ $external := strings.HasPrefix .URL "http" }}
      <a href="{{ if $external }}{{ .URL }}{{ else }}{{ .URL | relURL }}{{ end }}"
         {{ if $external }}rel="noopener"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>

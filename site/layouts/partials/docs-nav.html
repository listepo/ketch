{{ $current := . }}
{{ with site.GetPage "/docs" }}
<nav class="docs-nav" aria-label="Documentation">
  <p class="docs-nav-title">Documentation</p>
  <ul>
    <li><a href="{{ .Permalink }}" {{ if eq $current.Permalink .Permalink }}aria-current="page"{{ end }}>Overview</a></li>
    {{ range .Pages.ByWeight }}
      <li>
        <a href="{{ .Permalink }}" {{ if eq $current.Permalink .Permalink }}aria-current="page"{{ end }}>{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</nav>
{{ end }}

# git-cliff configuration: what a CHANGELOG.md entry says, from the conventional
# commits since the last `v*` tag. Two things render with it and must agree —
# scripts/release.sh (`bump.yml`, `just release`) and release-plz on its release
# pull request (`changelog_config` in release-plz.toml) — so it lives here
# rather than in either. git-cliff is pinned in mise.toml.
#
# The shape is Keep a Changelog, as every entry before this file had it:
# `## [x.y.z](…/releases/tag/vx.y.z) - date`, then `### Added`, `### Fixed`, …
# `tests/release_changelog.rs` parses exactly that, and dist lifts the section
# for a version out of CHANGELOG.md as its GitHub release notes.

[changelog]
# Written only when CHANGELOG.md is created; on an existing file both writers
# keep whatever sits above the entries. So the file's header was aligned to
# this once, and `tests/release_changelog.rs` fails if the two drift apart —
# change it here, then in the file, never only there.
header = """# Changelog

<!-- Generated by git-cliff from conventional commits, with cliff.toml. Do not edit it by hand: an entry comes from a commit message, and this header from [changelog] header in cliff.toml. -->

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""
# The heading links the release page, not the diff: it holds the tarballs and
# the `SHA256SUMS` that `install.sh` and `ketch self upgrade` fetch, so it is
# what someone reading the changelog is looking for. The tag name `v<version>`
# is a contract with release.yml and the tests.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/listepo/ketch/releases/tag/v{{ version | trim_start_matches(pat="v") }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# A subject that is not conventional still lands, under Other: commitlint keeps
# them out of pull requests, and one that slipped through still shipped.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
# A squash merge ends its subject with `(#123)`; that becomes the link.
commit_preprocessors = [
  { pattern = '(?m) \(#([0-9]+)\)$', replace = " ([#${1}](https://github.com/listepo/ketch/pull/${1}))" },
]
# The `<!-- N -->` prefix orders the groups; `striptags` in the body hides it.
commit_parsers = [
  # The version commit, and the merge of a release pull request: bookkeeping
  # the next entry would otherwise list.
  { message = "^chore: release v", skip = true },
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^feat", group = "<!-- 0 -->added" },
  { message = "^fix", group = "<!-- 1 -->fixed" },
  { message = "^.*", group = "<!-- 2 -->other" },
]

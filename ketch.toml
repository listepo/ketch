# ketch, as a ketch package.
#
# This is the file `ketch registry push` sends to the registry (listepo/ketch-registry,
# folder `ketch/`), and what `ketch self install` resolves through once it is
# there. It must stay in step with the entry in src/builtin.toml, which serves
# the same purpose for a machine that has not fetched the registry yet.
# Schema: docs/MANIFESTS.md.

name = "ketch"
source = "github:listepo/ketch"
description = "Catch releases straight from GitHub"
homepage = "https://github.com/listepo/ketch"

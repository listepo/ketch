# release-plz proposes the version bump and writes the changelog. Merging the
# pull request it opens is what releases ketch, through
# `.github/workflows/release.yml`.
#
# Three defaults are deliberately off, and one command is deliberately never
# run — `.github/workflows/release-plz.yml` runs only `release-pr`:
#
# - `publish`, because ketch is distributed as a tarball attached to a GitHub
#   release, not as a crate. Nobody installs it with `cargo install`, and
#   leaving this on would start publishing to crates.io on every merge.
# - `git_release_enable`, because release.yml creates the GitHub release and
#   attaches both tarballs and the aggregate `SHA256SUMS`. Two tools creating
#   the same release is a race, and losing it leaves a release with no assets —
#   which is the one thing `install.sh` and `ketch self update` both read.
# - tagging, because a tag is a promise that a release exists. release.yml
#   creates it by publishing the release it has just finished building, so a
#   failed build leaves main untagged rather than tagged with nothing behind
#   it. That is why the `release` command is not run here at all.

[workspace]
publish = false
git_release_enable = false

# Still a contract, even though nothing here creates the tag: release.yml
# derives `v<version>` from `Cargo.toml`, and the changelog entries link to
# `releases/tag/v<version>` — a link `tests/release_changelog.rs` checks.
# Changing this name means changing both.
git_tag_name = "v{{ version }}"

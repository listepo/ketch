# release-plz proposes the version bump and writes the changelog. The tag it
# pushes on merge is what actually publishes ketch, through
# `.github/workflows/release.yml`.
#
# Two defaults are deliberately off:
#
# - `publish`, because ketch is distributed as a tarball attached to a GitHub
#   release, not as a crate. Nobody installs it with `cargo install`, and
#   leaving this on would start publishing to crates.io on every merge.
# - `git_release_enable`, because release.yml creates the GitHub release and
#   attaches both tarballs and the aggregate `SHA256SUMS`. Two tools creating
#   the same release is a race, and losing it leaves a release with no assets —
#   which is the one thing `install.sh` and `ketch self update` both read.

[workspace]
publish = false
git_release_enable = false

# The other end of a coupling that is easy to miss: release.yml triggers on
# `v*` and refuses a tag that disagrees with Cargo.toml. Changing this name
# without changing that trigger means merging a release pull request publishes
# nothing at all.
git_tag_name = "v{{ version }}"

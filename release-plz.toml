# release-plz no longer runs in CI: the Bump workflow (bump.yml) is the only
# way to a release and the only thing that tags. What is left here is for a
# local `release-plz update` preview, with every way release-plz could release
# turned off:
#
# - `publish`, because ketch is distributed as tarballs attached to a GitHub
#   release, not as a crate.
# - `git_release_enable` and `git_tag_enable`, because bump.yml creates the tag
#   on the merged version commit and the draft release, and dist only uploads
#   the tarballs and the aggregate `SHA256SUMS` to it.

[workspace]
publish = false
git_release_enable = false
git_tag_enable = false

# Without this, release-plz never proposes a bump. It asks the cargo registry
# for the last released version, and `ketch` is not on crates.io — so the
# lookup comes back empty, release-plz concludes the package has never been
# released, and proposes the version already in `Cargo.toml`. Git tags are the
# only record that a ketch release happened: bump.yml creates them.
git_only = true

# Below 1.0 release-plz sends a `feat:` to the patch. ketch is documented the
# other way round — `feat:` moves the minor, `fix:` the patch — because a new
# command is worth more than a third digit to someone deciding whether to
# upgrade, 1.0 or not.
features_always_increment_minor = true

# Still a contract, even though nothing here creates the tag: bump.yml tags
# `v<version>` from `Cargo.toml`, and cliff.toml links each entry to
# `releases/tag/v<version>` — a link `tests/release_changelog.rs` checks.
# Changing this name means changing all three.
git_tag_name = "v{{ version }}"

# The version commit subject: scripts/release.sh writes the same one, and
# cliff.toml leaves it out of the next entry.
pr_name = "chore: release v{{ version }}"

# The entry's shape is cliff.toml's, shared with scripts/release.sh so both
# ways of cutting a release write the same thing.
changelog_config = "cliff.toml"

# The workspace is two crates with one version: the root `ketch` package, which
# is what ships, and `crates/ketch-core`, where most of the code now lives.
# release-plz reads commits per package, by the files they touch, and the
# root package's files stop at the nested crate: left alone, a `feat:` in the
# core would be written into a crates/ketch-core/CHANGELOG.md that nobody
# reads, and not into the release notes. The version group keeps the two on
# one version, `changelog_include` lists the core's commits in the root
# CHANGELOG.md, and the core keeps no changelog of its own.
#
# git_only reads each package at its last tag, and no tag before the split has
# a ketch-core in it: until one does, `release-plz` stops with "cannot find
# package ketch-core". The first release after the split is therefore cut
# with bump.yml; from its tag on, the group works as above.
[[package]]
name = "ketch"
version_group = "ketch"
changelog_include = ["ketch-core"]

[[package]]
name = "ketch-core"
version_group = "ketch"
changelog_update = false

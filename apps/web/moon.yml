layer: application
language: javascript

# The landing page is outside the TypeScript project graph: no `tsc --build`
# project, no vitest suite, and Biome does not format `.astro`. Astro's own
# check stands in for the typecheck.
workspace:
  inheritedTasks:
    exclude: ["typecheck", "lint", "format", "test"]

tasks:
  check:
    command: "pnpm exec astro check"
    inputs: ["src/**/*", "astro.config.mjs", "tsconfig.json"]
  build:
    command: "pnpm exec astro build"
    inputs: ["src/**/*", "public/**/*", "astro.config.mjs"]
    outputs: ["dist"]

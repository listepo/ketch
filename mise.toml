# Developer tools that are not crate dependencies, pinned so every machine and
# every agent runs the same one. The Rust entry is the one Rust version for local
# work, CI and release builds; bump it here and nowhere else. The MSRV
# (rust-version = 1.86 in Cargo.toml) is a separate promise and does not follow it.
[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" } # mise installs the minimal profile otherwise
"cargo:cargo-cache" = "0.8.3" # `just cache` / `just cache-autoclean`; the shared cargo home fills up
node = "24.20.0"              # commitlint for `just lint-commits` and the commit-msg hook; node-based checks live in Just and CI only
ruby = "3.4.11"               # `just lint-shell` -> tests/release-workflows.sh parses the workflows with ruby
cargo-dist = "0.32.0" # generates .github/workflows/release.yml and builds the release tarballs (`just dist-generate`, `just package`)
git-cliff = "2.13.1" # writes the CHANGELOG.md entry for a release, from cliff.toml (`scripts/release.sh`, and release-plz on its pull request)
xcodegen = "2.46.0" # generates desktop/macos/Ketch.xcodeproj from project.yml (`just macos-app`, `just macos-test`); the project file is not committed
"cargo:cargo-fuzz" = "0.13.2" # `just fuzz`; runs with `cargo +nightly`, a rustup toolchain outside this pin (fuzz/README.md)

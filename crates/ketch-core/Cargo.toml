[package]
name = "ketch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Everything ketch does besides parsing its command line: resolving, fetching, verifying, unpacking and linking client apps."
license.workspace = true
repository.workspace = true
# Linked into the `ketch` binary, never released on its own.
publish = false

# dist builds the `ketch` binary only; this crate has none to package.
[package.metadata.dist]
dist = false

[dependencies]
# `shell::Shell` is a clap `ValueEnum` and `CompletionShell` maps onto
# `clap_complete::Shell`; the command line itself lives in the binary.
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Writing a chosen `bin` back into a user manifest without touching the rest
# of the file, comments and layout included; `toml` alone would re-render it.
toml_edit = "0.25"
ureq = { version = "2", features = ["json", "proxy-from-env"] }
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
bzip2 = "0.6"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
walkdir = "2"
semver = "1"
tempfile = "3"
dirs = "7"
# canonicalize without Windows `\\?\` UNC prefixes (path compare / display)
dunce = "1"
# relative path between two absolute paths (copy_tree, platform link checks)
pathdiff = "0.2"
# parse Windows archive member paths correctly on any host (zip-slip guard)
typed-path = "0.12"
thiserror = "2"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3"
# `bundled` compiles SQLite into the binary. Linking the system one would make
# ketch's single-binary promise depend on what the host happens to ship, and
# the release builds both macOS architectures where that answer differs.
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# `ketch registry push` talks to GitHub through octocrab rather than the ureq
# client the sources use: it needs forks, refs, contents and pull requests,
# which octocrab already types and paginates. It is async, hence tokio for a
# runtime to block on; everything else in ketch stays synchronous.
octocrab = "0.54"
tokio = { version = "1", features = ["rt"] }
# Publisher signatures (the manifest's `trust` table). Verification only:
# sigstore without its signing, OCI and TUF-fetching halves, rPGP without
# bzip2 (signatures are never compressed), minisign-verify has no deps.
sigstore = { version = "0.14", default-features = false, features = ["verify"] }
minisign-verify = "0.2"
pgp = { version = "0.20", default-features = false }

[dev-dependencies]
insta = "1.48"
pretty_assertions = "1.4.1"
proptest = "1.11"
rstest = "0.26"
# Only the schema drift tests use it; the derives are `cfg_attr(test, ...)`.
schemars = "1.2"

[lints]
workspace = true

# What the header drift test in src/lib.rs generates include/ketch.h with.
language = "C"
include_guard = "KETCH_H"
header = """
/*
 * Copyright (c) 2026 Ivan Tugay
 * SPDX-License-Identifier: GPL-3.0-or-later
 *
 * Generated by cbindgen from crates/ketch-capi/src/abi.rs:
 * `KETCH_BLESS=1 cargo nextest run -p ketch-capi`. Do not edit.
 */"""
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true

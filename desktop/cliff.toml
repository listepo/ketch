# git-cliff configuration for the macOS app's release notes: the conventional
# commits since the last `desktop-v*` tag that touched the app or its FFI
# crate. The CLI's changelog is ../cliff.toml; the two never share a tag, and
# each one's tag_pattern is anchored so neither ever mistakes the other's tag
# for its own previous release. git-cliff is pinned in mise.toml.
#
# Nothing writes a CHANGELOG file from this: .github/workflows/desktop-release.yml
# renders the unreleased section as the GitHub release's notes, and the
# release page is the app's changelog.

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="desktop-v") }}](https://github.com/pyrlyn/ketch/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^desktop-v[0-9].*"
# Only what ships in Ketch.app. The CLI's commits are the CLI's notes.
include_paths = ["desktop/**", "crates/ketch-ffi/**"]
topo_order = false
sort_commits = "newest"
commit_preprocessors = [
  { pattern = '(?m) \(#([0-9]+)\)$', replace = " ([#${1}](https://github.com/pyrlyn/ketch/pull/${1}))" },
]
commit_parsers = [
  { message = "^chore: release v", skip = true },
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^feat", group = "<!-- 0 -->added" },
  { message = "^fix", group = "<!-- 1 -->fixed" },
  { message = "^.*", group = "<!-- 2 -->other" },
]
